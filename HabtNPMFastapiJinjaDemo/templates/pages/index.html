{% extends "base.html" %}

{% block title %}{{ title }} · {{ app_name }}{% endblock %}

{% block content %}
<section class="text-center">
    <h1 class="text-3xl font-bold text-slate-900">FastAPI + Jinja2 + Tailwind</h1>
    <p class="mt-3 text-slate-600">Минимальный демо-проект с понятной архитектурой.</p>
</section>

<section class="mt-10 grid gap-4 sm:grid-cols-3">
    {% for name, description in features %}
    <article class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
        <h2 class="font-semibold text-indigo-600">{{ name }}</h2>
        <p class="mt-2 text-sm text-slate-600">{{ description }}</p>
    </article>
    {% endfor %}
</section>

<section class="mt-10 text-center">
    <button id="ping-btn"
            class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition-colors">
        Проверить /api/ping
    </button>
    <p id="ping-result" class="mt-3 text-sm text-slate-500"></p>
</section>
{% endblock %}
